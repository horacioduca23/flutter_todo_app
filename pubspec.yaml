name: flutter_todo_app
description: "A simple ToDo Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.8.1'

dependencies:
  flutter:
    sdk: flutter
  
  # Core Dependencies
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^16.0.0
  http: ^1.4.0

  cupertino_icons: ^1.0.8
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.2.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.3
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/env/
    - assets/images/